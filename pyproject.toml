[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adsbrx"
version = "0.1.0"
description = "ADS-B (1090 MHz Mode S) receiver for RTL-SDR written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/adsbrx/static/vendor/LEAFLET-LICENSE.txt"]
authors = [{ name = "fractional-n" }]
keywords = ["ads-b", "adsb", "mode-s", "1090mhz", "rtl-sdr", "rtlsdr", "sdr", "aircraft", "dump1090"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# pyModeS 3 needs Python 3.11+; without it tests/test_modes.py is skipped.
dev = [
    "pytest>=8",
    "pyModeS>=3.0; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/fractional-n/adsbrx"
Source = "https://github.com/fractional-n/adsbrx"
Issues = "https://github.com/fractional-n/adsbrx/issues"
Changelog = "https://github.com/fractional-n/adsbrx/blob/main/CHANGELOG.md"

[project.scripts]
adsbrx = "adsbrx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adsbrx = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
